# Nach /etc/mongod.conf kopieren (siehe docs/datenbank-backup.md).
# MongoDB nur lokal für die Next.js-App, Anmeldung Pflicht.
storage:
  dbPath: /var/lib/mongodb
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.5   # Server teilt sich 4 GB RAM mit Jitsi
systemLog:
  destination: file
  logAppend: true
  logRotate: reopen
  path: /var/log/mongodb/mongod.log
net:
  port: 27017
  bindIp: 127.0.0.1
processManagement:
  timeZoneInfo: /usr/share/zoneinfo
security:
  authorization: enabled
