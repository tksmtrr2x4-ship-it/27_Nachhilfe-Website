# Fängt alle Anfragen ab, deren Hostname zu keinem server-Block passt (z. B.
# Scanner, die nur die IP aufrufen). Auf dem Server unter
# /etc/nginx/sites-available/00-default.conf, verlinkt nach sites-enabled/.
# Port 443: TLS-Handshake wird abgelehnt, es wird kein Zertifikat gezeigt.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
    access_log off;
    return 444;
}
