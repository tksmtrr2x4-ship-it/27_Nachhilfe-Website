# Snippet für den http{}-Block von /etc/nginx/nginx.conf (map/log_format sind
# nur auf http-Ebene erlaubt, nicht im Server-/Location-Block). Siehe
# docs/logging.md und docs/deployment-strato.md Abschnitt "Logfiles".
#
# Einbinden: Inhalt in den http{}-Block von /etc/nginx/nginx.conf einfügen
# (z.B. per `include /etc/nginx/anonymize-ip.conf;` direkt nach `http {`),
# danach den Standard-`log_format combined`-Zugriff in den Server-Blöcken
# auf `access_log ... anonymized;` umstellen (siehe unten).

# IPv4: letztes Oktett auf 0 setzen (192.168.1.42 -> 192.168.1.0).
# IPv6: die letzten 80 Bit (5 von 8 Blöcken) auf 0 setzen.
map $remote_addr $ip_anonymized {
    default 0.0.0.0;
    "~(?P<ip>\d+\.\d+\.\d+)\.\d+"           $ip.0;
    "~(?P<ip>[^:]+:[^:]+:[^:]+):.*"          $ip::;
}

log_format anonymized '$ip_anonymized - [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_referer" '
                       '"$http_user_agent"';
