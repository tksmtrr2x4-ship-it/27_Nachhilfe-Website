# http{}-Ebene, liegt auf dem Server unter /etc/nginx/conf.d/ und wird von
# nginx.conf automatisch eingebunden. Siehe docs/security/SERVER_HARDENING.md.

# Keine Versionsnummer in „Server:“ und auf Fehlerseiten.
server_tokens off;

# Langsame oder hängende Clients nicht ewig festhalten. client_body_timeout
# zählt zwischen zwei Lesevorgängen, nicht für den ganzen Upload – große
# Unterlagen (50 MB) bleiben damit möglich.
client_body_timeout   15s;
client_header_timeout 15s;
keepalive_timeout     30s;
large_client_header_buffers 4 8k;

# Allgemeine Bremse je IP. Gehashte Next.js-Assets zählen nicht mit (leerer
# Schlüssel = keine Begrenzung), damit ein Seitenaufruf mit vielen Dateien
# nicht ausgebremst wird.
map $uri $lernsprung_req_key {
    ~^/_next/static/  "";
    default           $binary_remote_addr;
}
limit_req_zone $lernsprung_req_key zone=lernsprung_req:10m rate=20r/s;

# Strenge Bremse nur für POSTs auf Anmelde- und Formularwege. Die Routen
# haben zusätzlich eigene Sperren in der App (lib/auth/rateLimit.js,
# darfMailSenden); das hier fängt Massenversuche schon vor Node.js ab.
map "$request_method:$uri" $lernsprung_auth_key {
    default "";
    "~^POST:/api/(konto/(login|registrieren|passwort|bestaetigen|widerruf|kennenlernen)|widerruf|anmeldung-bestaetigen|bookings|admin/auth/(start|finish))$" $binary_remote_addr;
}
limit_req_zone $lernsprung_auth_key zone=lernsprung_auth:10m rate=10r/m;

limit_conn_zone $binary_remote_addr zone=lernsprung_conn:10m;

limit_req_status  429;
limit_conn_status 429;
