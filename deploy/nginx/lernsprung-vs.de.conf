# nginx-Vhost für Lernsprung.VS (siehe docs/deployment-strato.md).
#
# WICHTIG: Diese Datei ist eine Vorlage für den initialen `nginx -t`/reload.
# Sobald `certbot --nginx -d www.lernsprung-vs.de -d lernsprung-vs.de` läuft,
# ergänzt certbot automatisch die `listen 443 ssl`-Blöcke und den
# HTTP->HTTPS-Redirect für den www.lernsprung-vs.de-Serverblock unten – das
# danach von certbot geänderte Ergebnis ist die tatsächlich gültige Datei,
# nicht mehr exakt diese Vorlage.

# Kanonische Domain: alles läuft über www.lernsprung-vs.de.
server {
    server_name www.lernsprung-vs.de;

    # Setzt voraus, dass deploy/nginx/anonymize-ip.conf im http{}-Block von
    # /etc/nginx/nginx.conf eingebunden ist (siehe docs/logging.md).
    access_log /var/log/nginx/lernsprung-access.log anonymized;

    # Der Tuer-Code steht in der Adresse und laege damit im Klartext im
    # Zugriffsprotokoll. Dort hat er nichts verloren - siehe docs/admin-zugang.md.
    location ^~ /tor/ {
        access_log off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Unterlagen im Unterrichtsraum: bis 50 MB je Datei, nur dieser Weg.
    location ~ ^/api/raum/[a-f0-9]+/unterlagen$ {
        client_max_body_size 51m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
    }

    # Beleg-Upload (Admin → Buchhaltung): bis 10 MB statt nginx-Standard 1 MB.
    # Bewusst nur für diesen Pfad, alle anderen Anfragen bleiben begrenzt.
    location /api/admin/ledger {
        client_max_body_size 11m;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    # Gehashte, unveränderliche Next.js-Assets aggressiv cachen.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript
        image/svg+xml;

    # Brotli ist im Standard-Ubuntu-nginx-Paket nicht enthalten. Falls
    # gewünscht: `sudo apt install libnginx-mod-http-brotli` (Ubuntu 22.04+)
    # und dann hier aktivieren:
    # brotli on;
    # brotli_comp_level 5;
    # brotli_types text/plain text/css application/json application/javascript
    #     text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.lernsprung-vs.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.lernsprung-vs.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# Alte Vercel-Subdomain und Apex-Domain: beide dauerhaft (301) auf die
# kanonische www-Adresse umleiten. DNS für beide muss auf diesen Server
# zeigen, damit der Redirect greift (siehe Umzugs-Checkliste in
# docs/deployment-strato.md Abschnitt 10).
server {
    server_name lernsprung-vs.de nachhilfe.lernsprung-vs.de;

    location / {
        return 301 https://www.lernsprung-vs.de$request_uri;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.lernsprung-vs.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.lernsprung-vs.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    listen 80;
    listen [::]:80;
    server_name www.lernsprung-vs.de;
    return 301 https://www.lernsprung-vs.de$request_uri;
}
# HTTP ohne www: direkt in EINEM Sprung auf die kanonische https://www-Adresse
# (vorher zwei Sprünge: erst https://lernsprung-vs.de, dann www). Pfad und
# Query bleiben über $request_uri erhalten.
server {
    listen 80;
    listen [::]:80;
    server_name lernsprung-vs.de nachhilfe.lernsprung-vs.de;
    return 301 https://www.lernsprung-vs.de$request_uri;
}