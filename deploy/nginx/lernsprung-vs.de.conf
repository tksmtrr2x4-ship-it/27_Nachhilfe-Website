# nginx-Vhost für Lernsprung.VS – Stand des Servers
# (/etc/nginx/sites-available/lernsprung-vs.de.conf). Die Zeilen mit
# „managed by Certbot“ hat certbot eingefügt; bei Zertifikatsänderungen
# erneut vom Server übernehmen. Gemeinsame Bausteine:
#   conf.d/lernsprung-haertung.conf   (http-Ebene: Bremsen, Zeitlimits, server_tokens)
#   snippets/lernsprung-proxy.conf    (Weitergabe an Next.js)
#   snippets/lernsprung-sperren.conf  (PHP- und Scanner-Pfade → 404)
#   00-default.conf                   (unbekannte Hostnamen abweisen)
# Siehe docs/security/SERVER_HARDENING.md.

# Kanonische Domain: alles läuft über www.lernsprung-vs.de.
server {
    server_name www.lernsprung-vs.de;

    # Setzt voraus, dass deploy/nginx/anonymize-ip.conf im http{}-Block von
    # /etc/nginx/nginx.conf eingebunden ist (siehe docs/logging.md).
    access_log /var/log/nginx/lernsprung-access.log anonymized;

    # HTTPS ein Jahr lang erzwingen (S-06). Ohne includeSubDomains/preload,
    # meet. setzt seinen eigenen Kopf. „always“ auch für Fehlerantworten.
    add_header Strict-Transport-Security "max-age=31536000" always;

    limit_req  zone=lernsprung_req  burst=60 nodelay;
    limit_req  zone=lernsprung_auth burst=10 nodelay;
    limit_conn lernsprung_conn 40;

    include /etc/nginx/snippets/lernsprung-sperren.conf;

    # Der Tuer-Code steht in der Adresse und laege damit im Klartext im
    # Zugriffsprotokoll. Dort hat er nichts verloren - siehe docs/admin-zugang.md.
    location ^~ /tor/ {
        access_log off;
        include /etc/nginx/snippets/lernsprung-proxy.conf;
    }

    location / {
        include /etc/nginx/snippets/lernsprung-proxy.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_cache_bypass $http_upgrade;
    }

    # Unterlagen im Unterrichtsraum: bis 50 MB je Datei, nur dieser Weg.
    location ~ ^/api/raum/[a-f0-9]+/unterlagen$ {
        client_max_body_size 51m;
        include /etc/nginx/snippets/lernsprung-proxy.conf;
        proxy_request_buffering off;
        proxy_read_timeout 180s;
    }

    # Beleg-Upload (Admin → Buchhaltung): bis 10 MB statt nginx-Standard 1 MB.
    # Bewusst nur für diesen Pfad, alle anderen Anfragen bleiben begrenzt.
    location /api/admin/ledger {
        client_max_body_size 11m;
        include /etc/nginx/snippets/lernsprung-proxy.conf;
        proxy_request_buffering off;
    }

    # Gehashte, unveränderliche Next.js-Assets aggressiv cachen. add_header
    # hier ersetzt die geerbten Köpfe, deshalb HSTS wiederholen.
    location /_next/static/ {
        include /etc/nginx/snippets/lernsprung-proxy.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security "max-age=31536000" always;
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
        text/xml application/xml application/xml+rss text/javascript
        image/svg+xml;

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.lernsprung-vs.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.lernsprung-vs.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

# Alte Vercel-Subdomain und Apex-Domain: beide dauerhaft (301) auf die
# kanonische www-Adresse umleiten. nachhilfe. hat seit 10/2026 keinen
# DNS-Eintrag mehr, der Name bleibt für alte Lesezeichen im Zertifikat.
server {
    server_name lernsprung-vs.de nachhilfe.lernsprung-vs.de;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        return 301 https://www.lernsprung-vs.de$request_uri;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/www.lernsprung-vs.de/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/www.lernsprung-vs.de/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    listen 80;
    listen [::]:80;
    server_name www.lernsprung-vs.de;
    return 301 https://www.lernsprung-vs.de$request_uri;
}
# HTTP ohne www: direkt in EINEM Sprung auf die kanonische https://www-Adresse
# (vorher zwei Sprünge: erst https://lernsprung-vs.de, dann www). Pfad und
# Query bleiben über $request_uri erhalten.
server {
    listen 80;
    listen [::]:80;
    server_name lernsprung-vs.de nachhilfe.lernsprung-vs.de;
    return 301 https://www.lernsprung-vs.de$request_uri;
}
