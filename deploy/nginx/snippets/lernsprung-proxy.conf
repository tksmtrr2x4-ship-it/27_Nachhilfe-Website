# Gemeinsame Weitergabe an Next.js (127.0.0.1:3000). Auf dem Server unter
# /etc/nginx/snippets/. In jeder location einbinden, die proxy_pass nutzt –
# eigene proxy_set_header in einer location würden sonst alle geerbten
# ersetzen.
proxy_pass http://127.0.0.1:3000;
proxy_http_version 1.1;
proxy_set_header Host $host;
# Nur die echte Gegenstelle weiterreichen; vom Client gesendete
# X-Forwarded-For-Werte werden verworfen (vgl. lib/clientIp.js).
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
# Interner Next.js-Kopf, darf nie von außen kommen (CVE-2025-29927-Muster).
proxy_set_header x-middleware-subrequest "";
