# Pfade, die es in dieser App nicht gibt und die nur Scanner abfragen. nginx
# antwortet selbst mit 404, Next.js sieht die Anfrage nie. Auf dem Server
# unter /etc/nginx/snippets/, eingebunden im server-Block von www.
# Geprüft am 21.10.2026: keine Route unter app/ und keine Datei unter public/
# passt auf diese Muster.
location ~* \.(php[0-9]?|phtml|phar|cgi|pl|asp|aspx|jsp)$ {
    access_log off;
    return 404;
}
location ~* ^/(wp-admin|wp-login\.php|wp-content|wp-includes|xmlrpc\.php|phpmyadmin|pma|adminer|cgi-bin|vendor/phpunit)(/|$) {
    access_log off;
    return 404;
}
# Versteckte Dateien (.env, .git …), außer /.well-known/.
location ~ /\.(?!well-known/) {
    access_log off;
    return 404;
}
